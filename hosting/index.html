<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="TechnoLoad smart fleet management"><title>TechnoLoad | Fleet management</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div id="app"></div>
  <dialog id="dialog"><form method="dialog" id="asset-form"><header><b id="dialog-title">Register asset</b><button value="cancel" aria-label="Close">×</button></header><input id="asset-id" type="hidden"><label>Name<input id="asset-name" required placeholder="e.g. Volvo FH Truck"></label><label>Type<select id="asset-type"><option value="Machinery">Machinery</option><option value="Truck">Truck</option><option value="Dump truck">Dump truck</option><option value="Crane">Crane</option></select></label><label>Current usage (hours/km)<input id="asset-usage" type="number" min="0" required></label><label>Status<select id="asset-status"><option value="AVAILABLE">Available</option><option value="IN_OPERATION">In operation</option><option value="IN_MAINTENANCE">In maintenance</option></select></label><menu><button value="cancel">Cancel</button><button class="primary" value="default">Save asset</button></menu></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
