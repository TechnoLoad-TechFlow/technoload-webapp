<!doctype html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="description" content="Panel operativo de TechnoLoad"/><title>TechnoLoad | Plataforma</title><link rel="stylesheet" href="styles.css"/><style>#language-switch{position:fixed;right:18px;bottom:18px;z-index:8;border-radius:99px;background:#112b43;color:#fff;border:1px solid #fff;padding:10px 13px;font-weight:800;box-shadow:0 4px 14px #0003}</style></head><body><button id="language-switch" type="button" aria-label="Change language">EN</button><div id="app"></div><dialog id="dialog"><form method="dialog" id="asset-form"><header><b id="dialog-title">Registrar activo</b><button value="cancel" aria-label="Cerrar">×</button></header><input id="asset-id" type="hidden"/><label>Nombre<input id="asset-name" required placeholder="Ej. Camión Volvo FH"/></label><label>Tipo<select id="asset-type"><option>Maquinaria</option><option>Camión</option><option>Volquete</option><option>Grúa</option></select></label><label>Uso actual (horas/km)<input id="asset-usage" type="number" min="0" required/></label><label>Estado<select id="asset-status"><option value="AVAILABLE">Disponible</option><option value="IN_OPERATION">En operación</option><option value="IN_MAINTENANCE">En mantenimiento</option></select></label><menu><button value="cancel">Cancelar</button><button class="primary" id="save-asset" value="default">Guardar activo</button></menu></form></dialog><div id="toast" role="status" aria-live="polite"></div><script src="i18n.js"></script><script src="app.js"></script></body></html>
